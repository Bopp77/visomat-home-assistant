# LEGACY — Produktive Konfiguration für den Portainer-Stack (192.168.178.102,
# /opt/visomat/config.yaml). Seit v0.2.0 ist das HA-Add-on der primäre Weg;
# diese Datei wird nur noch für Umgebungen ohne HA-Supervisor verwendet und
# referenziert den Broker extern über die Host-IP.
#
# Für das Add-on: Optionen direkt in der HA-Oberfläche setzen (Tab Konfiguration)
# statt dieser Datei — siehe visomat/config.yaml (Schema/Defaults) im Repo.
# Nach Anlage: Messung am Gerät triggern, Werte gegen Display prüfen.

visomat:
  ble:
    mac: "DD:67:E2:1E:C0:93"
    name: "comfort soft"
    adapter: "hci0"
    scan_timeout_sec: 5
    scan_interval_sec: 2
    reconnect_delay_sec: 1
    timeout_sec: 15
    watchdog_max_failures: 8    # 0=aus: Neustart nach N Connect-Fehlern (BlueZ-Stuck-Discovery)
  mqtt:
    host: "192.168.178.105"        # Home Assistant / Mosquitto
    port: 1883
    username: "bopp"
    password: ""
    base_topic: "visomat_bt"
    discovery_prefix: "homeassistant"

garmin_sync:
  enabled: true
  mqtt:
    host: "192.168.178.105"
    port: 1883
    username: "bopp"
    password: ""
    topic_base: "visomat_bt"
  garmin:
    email: ""                      # Garmin-Konto (E-Mail)
    password: ""                   # Garmin-Passwort (einmalig für --login)
    timezone: "Europe/Berlin"
    token_path: "~/.garminconnect"
