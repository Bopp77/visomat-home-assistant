name: build-push-ghcr

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bopp77/visomat-home-assistant
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Also publish the version without the leading 'v' so the
            # Home Assistant add-on (image: ...) can pull {image}:{version}.
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tags=${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:$VERSION,${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE }}:latest,${{ env.IMAGE }}:main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
