# visomat comfort soft BT (BLE) -> Home Assistant
#
# Benötigt Zugriff auf BlueZ/D-Bus des Hosts. Start:
#   docker compose up -d --build

services:
  visomat-bt:
    build: .
    container_name: visomat-bt
    restart: unless-stopped
    network_mode: host                 # BLE via hci0
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /run/dbus:/run/dbus:ro
      - /var/run/dbus:/var/run/dbus:ro

  # Synchronisiert visomat-Messwerte (MQTT) nach Garmin Connect.
  # Aktivierung: garmin_sync.enabled: true in config.yaml.
  garmin-sync:
    build: .
    container_name: garmin-sync
    restart: unless-stopped
    command: ["python", "-m", "garmin_sync.main"]
    networks:
      - default
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - garmin-tokens:/root/.garminconnect

volumes:
  garmin-tokens:

networks:
  default:
    name: visomat-home-assistant
