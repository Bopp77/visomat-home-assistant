# visomat comfort soft BT (BLE) -> Home Assistant
#
# BLE im Container: Das Image startet BlueZ/D-Bus selbst (docker/entrypoint.sh).
# Der Host liefert nur den HCI-Adapter (hci0). Start:
#   docker compose up -d --build

services:
  visomat-bt:
    build: .
    container_name: visomat-bt
    restart: unless-stopped
    network_mode: host                 # BLE via hci0
    privileged: true                   # HCI-/rfkill-Zugriff (AF_BLUETOOTH im Container)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /dev:/dev                      # HCI-Sockets/rfkill für bleak bereitstellen

  # Synchronisiert visomat-Messwerte (MQTT) nach Garmin Connect.
  # Aktivierung: garmin_sync.enabled: true in config.yaml.
  # Start: docker compose --profile garmin up -d
  garmin-sync:
    build: .
    container_name: garmin-sync
    restart: unless-stopped
    command: ["python", "-m", "garmin_sync.main"]
    profiles: ["garmin"]
    networks:
      - default
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - garmin-tokens:/root/.garminconnect

volumes:
  garmin-tokens:

networks:
  default:
    name: visomat-home-assistant
